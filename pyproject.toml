[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-sensitivity-propaganda"
version = "0.1.0"
description = "Prompt sensitivity in LLM-based propaganda technique classification"
authors = [{ name = "Zaina Naaz Mohd Kalim Ansari" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.0",
    "sentencepiece",
    "protobuf",
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "pyyaml",
    "tqdm",
    "jsonlines",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest"]